<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" stroke="white" stroke-width="2"/>
  
  <!-- Car icon -->
  <g transform="translate(50, 50)">
    <!-- Car body -->
    <path d="M-15,-8 L-12,-12 L12,-12 L15,-8 L15,8 L12,8 L12,5 L-12,5 L-12,8 L-15,8 Z" 
          fill="white" opacity="0.9"/>
    
    <!-- Car windows -->
    <path d="M-10,-8 L-8,-10 L8,-10 L10,-8 L10,-2 L-10,-2 Z" 
          fill="white" opacity="0.7"/>
    
    <!-- Car wheels -->
    <circle cx="-8" cy="8" r="3" fill="white"/>
    <circle cx="8" cy="8" r="3" fill="white"/>
    <circle cx="-8" cy="8" r="1.5" fill="#2E7D32"/>
    <circle cx="8" cy="8" r="1.5" fill="#2E7D32"/>
  </g>
  
  <!-- Text -->
  <text x="50" y="75" text-anchor="middle" fill="white" font-size="8" font-weight="bold" font-family="Arial, sans-serif">
    Lạc GO
  </text>
</svg>
